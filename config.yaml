refresh_interval_seconds: 20
min_edge_pct: 0.5
max_hours_to_close: 48
sport_filter: []            # [] = all sports; ["soccer", "basketball"] = filter

venues:
  kalshi:
    enabled: true
    base_url: "https://external-api.kalshi.com/trade-api/v2"
  polymarket:
    enabled: true
    gamma_url: "https://gamma-api.polymarket.com"
    clob_url: "https://clob.polymarket.com"

fees:
  # null = use formula; set a Decimal string to override, e.g. "0.02"
  kalshi_taker_coeff: "0.07"         # 7¢ × price × (1-price)
  polymarket_sports_rate: "0.0075"   # 0.75% of face value at 50¢
  polymarket_default_rate: "0.01"    # fallback for non-sports markets
